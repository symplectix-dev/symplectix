syntax = "proto3";

package shed.protoc_plugin.testdata;

import "google/protobuf/any.proto";
import "shed/protoc_plugin/testdata/product.proto";
import "shed/protoc_plugin/testdata/review.proto";

message Customer {
  message Id {
    message Email {
      string address = 1;
    }

    message Phone {
      string number = 1;

      enum PhoneType {
        UNKNOWN = 0;
        MOBILE = 1;
        HOME = 2;
        WORK = 3;
      }
      PhoneType type = 2;
    }

    oneof id {
      int32 uid = 1;
      Email email = 2;
      Phone phone = 3;
    }
  }

  repeated Id ids = 1;

  enum Type {
    UNKNOWN = 0;
    A = 1;
    B = 2;
  }
  Type type = 2;

  google.protobuf.Any payload = 3;

  int32 i32 = 4;
  int64 i64 = 5;

  repeated Review reviews = 6;

  map<string, int32> tallies = 7;
  map<string, Product> products = 8;

  reserved 100 to max;
}

