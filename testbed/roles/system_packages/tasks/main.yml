- name: Show OS family
  ansible.builtin.debug:
    msg: "os_family={{ ansible_facts['os_family'] }}"

- name: Install packages (Arch Linux)
  when: ansible_facts['os_family'] == 'Archlinux'
  community.general.pacman:
    state: present
    name: "{{ packages }}"

- name: Check installed Firecracker version
  register: fc_installed
  changed_when: false
  failed_when: false
  ansible.builtin.command:
    cmd: /usr/local/bin/firecracker --version

- name: Install Firecracker
  when: ("v" ~ firecracker_version) not in (fc_installed.stdout | default(""))
  block:
    - name: Download and extract Firecracker
      ansible.builtin.unarchive:
        src: https://github.com/firecracker-microvm/firecracker/releases/download/v{{ firecracker_version }}/firecracker-v{{ firecracker_version }}-{{ cpu_arch }}.tgz
        dest: /tmp
        remote_src: true

    - name: Install Firecracker binary
      ansible.builtin.copy:
        src: /tmp/release-v{{ firecracker_version }}-{{ cpu_arch }}/firecracker-v{{ firecracker_version }}-{{ cpu_arch }}
        dest: /usr/local/bin/firecracker
        mode: "0755"
        remote_src: true

    - name: Remove Firecracker release directory
      ansible.builtin.file:
        path: /tmp/release-v{{ firecracker_version }}-{{ cpu_arch }}
        state: absent
